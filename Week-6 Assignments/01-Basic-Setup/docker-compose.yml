services:
  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    volumes:
      - floci-data:/var/lib/floci
      - /var/run/docker.sock:/var/run/docker.sock   # required for EC2, RDS, and other Docker-backed services
    environment:
      - FLOCI_LOG_LEVEL=info

volumes:
  floci-data:
